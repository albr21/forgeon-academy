<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="322px" preserveAspectRatio="none" style="width:642px;height:322px;" version="1.1" viewBox="0 0 642 322" width="642px" zoomAndPan="magnify"><defs/><g><!--cluster GitHub-Hosted Runners--><g id="cluster_GitHub-Hosted Runners"><rect fill="#EEF4FF" height="120" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="294" x="12" y="12"/><text fill="#14213D" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="186" x="66" y="26.9951">GitHub-Hosted Runners</text></g><!--cluster Self-Hosted Runners--><g id="cluster_Self-Hosted Runners"><rect fill="#EEF4FF" height="120" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="292" x="330" y="12"/><text fill="#14213D" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="163" x="394.5" y="26.9951">Self-Hosted Runners</text></g><!--cluster Ephemeral Self-Hosted Runners--><g id="cluster_Ephemeral Self-Hosted Runners"><rect fill="#EEF4FF" height="120" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="267" x="343" y="196"/><text fill="#14213D" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="251" x="351" y="210.9951">Ephemeral Self-Hosted Runners</text></g><!--entity ghhosted--><g id="elem_ghhosted"><rect fill="#EEF4FF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="262" x="28" y="47"/><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="189" x="38" y="69.9951">Managed entirely by GitHub</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="242" x="38" y="86.292">Ubuntu / Windows / macOS images</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="198" x="38" y="102.5889">Fresh virtual machine per job</text></g><!--entity selfhosted--><g id="elem_selfhosted"><rect fill="#EEF4FF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="259" x="346.5" y="47"/><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="113" x="356.5" y="69.9951">Managed by you</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="227" x="356.5" y="86.292">Custom hardware / OS / software</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="239" x="356.5" y="102.5889">Persistent between jobs by default</text></g><!--entity ephemeral--><g id="elem_ephemeral"><rect fill="#EEF4FF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#4F8FFF;stroke-width:1.0;" width="215" x="368.5" y="231"/><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="145" x="378.5" y="253.9951">Same as self-hosted,</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="195" x="378.5" y="270.292">but destroyed after each job</text><text fill="#14213D" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="178" x="378.5" y="286.5889">Better isolation &amp; security</text></g><!--link selfhosted to ephemeral--><g id="link_selfhosted_ephemeral"><path d="M476,116.31 C476,149 476,192.25 476,224.87 " fill="none" id="selfhosted-to-ephemeral" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="476,230.87,480,221.87,476,225.87,472,221.87,476,230.87" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="80" x="515.5" y="161.0669">hardened by</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="157" x="477" y="176.1997">recreating after each job</text></g><!--SRC=[ZP8_JyCm4CNtV8eZ